name: Build Android APK

# Build a release APK on demand. Provide your public backend URL when you
# run it (Actions tab → "Build Android APK" → Run workflow), or push to the
# branch to build with the default. Each build also publishes the APK to a
# GitHub Release ("latest-apk") for a stable, direct download link.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend API base URL baked into the APK"
        required: true
        default: "http://10.0.2.2:8000/api/v1"
  push:
    branches: ["claude/code-master-prompt-t3cu6t"]
    paths: ["mobile/**", ".github/workflows/build-apk.yml"]

permissions:
  contents: write  # needed to create/update the Release

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="${{ github.event.inputs.api_base_url || 'http://10.0.2.2:8000/api/v1' }}"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/lms-student-app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lms-student-app-release
          path: mobile/build/app/outputs/flutter-apk/lms-student-app.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest Student APK
          body: |
            Latest build of the LMS student app (debug/test build).

            **Baked backend URL:** `${{ github.event.inputs.api_base_url || 'http://10.0.2.2:8000/api/v1' }}`

            > To target a real device, run the workflow with your public backend URL.
            > Enable "install from unknown sources" on the device before installing.
          files: mobile/build/app/outputs/flutter-apk/lms-student-app.apk
          make_latest: true
