name: Build APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend API base URL baked into the APK'
        required: false
        default: 'http://84.8.223.62/api/v1'
      google_web_client_id:
        description: 'Google Sign-In WEB OAuth client ID (optional)'
        required: false
        default: ''
      whatsapp_number:
        description: 'WhatsApp number for manual payment, e.g. 2126XXXXXXXX (optional)'
        required: false
        default: ''
  push:
    branches: [main, claude/code-master-prompt-t3cu6t]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

# Needed to upload the built APK onto the `latest-apk` release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # Fail on real errors, but don't block the build on style infos.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL='${{ github.event.inputs.api_base_url || 'http://84.8.223.62/api/v1' }}' \
            --dart-define=GOOGLE_WEB_CLIENT_ID='${{ github.event.inputs.google_web_client_id }}' \
            --dart-define=WHATSAPP_NUMBER='${{ github.event.inputs.whatsapp_number }}'
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/focus-languages.apk

      # Per-run copy (downloading an artifact requires a GitHub login).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-languages-apk
          path: mobile/build/app/outputs/flutter-apk/focus-languages.apk

      # Release asset = stable public direct link, no login needed:
      # https://github.com/<owner>/<repo>/releases/download/latest-apk/focus-languages.apk
      - name: Publish APK to the latest-apk release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-apk --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create latest-apk --repo "$GITHUB_REPOSITORY" \
                 --title "Latest Student APK" \
                 --notes "Auto-published by CI — always the newest build."
          gh release upload latest-apk \
            build/app/outputs/flutter-apk/focus-languages.apk \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Summary
        run: |
          {
            echo "### 📱 APK ready"
            echo ""
            echo "**Direct download:** https://github.com/$GITHUB_REPOSITORY/releases/download/latest-apk/focus-languages.apk"
            echo ""
            echo "API baked in: \`${{ github.event.inputs.api_base_url || 'http://84.8.223.62/api/v1' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
