name: lms_mobile
description: English Learning LMS — student app (Flutter, Android/iOS/Web).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.5.1
  # HTTP
  dio: ^5.4.3+1
  # Routing
  go_router: ^14.0.2
  # Local secure storage for JWT
  flutter_secure_storage: ^9.0.0
  # Misc
  intl: ^0.19.0
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
