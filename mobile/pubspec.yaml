name: lms_mobile
description: English Learning LMS — student app (Flutter, Android/iOS/Web).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.5.1
  # HTTP
  dio: ^5.4.3+1
  # Routing
  go_router: ^14.0.2
  # Local secure storage for JWT
  flutter_secure_storage: ^9.0.0
  # Text-to-speech (vocabulary pronunciation)
  flutter_tts: ^4.0.2
  # Markdown rendering for lesson text
  flutter_markdown: ^0.7.4
  # Video playback
  video_player: ^2.9.1
  chewie: ^1.8.5
  # Misc
  intl: ^0.20.2
  url_launcher: ^6.2.6
  # Certificate download + share
  path_provider: ^2.1.3
  share_plus: ^12.0.2
  # Feedback: tones, celebration, micro-animations
  audioplayers: ^6.0.0
  confetti: ^0.8.0
  flutter_animate: ^4.5.0
  # Pronunciation training (on-device speech recognition).
  # 6.x's Android build.gradle uses jcenter(), which current AGP/Gradle no
  # longer supports -> build failure. 7.x fixed this and needs web ^1.0.0,
  # so share_plus is upgraded alongside it to keep the resolver happy.
  speech_to_text: ^7.0.0
  # Smart notifications (daily streak reminder, achievement unlocks).
  # Requires core library desugaring — enabled in android/app/build.gradle.kts.
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  # Google Sign-In (v2 §6.1) — ID token verified server-side via google-auth.
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
