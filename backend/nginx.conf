server {
    listen 80;
    # Above the 200 MB video ceiling (MEDIA_MAX_VIDEO_MB) so an oversized
    # upload is rejected by Django with a JSON error rather than by nginx
    # with an HTML 413 the API client can't parse.
    client_max_body_size 210m;

    # --- Django: REST API, Django admin, and their assets ----------------- #
    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Admin panel: static Vite build (hash-routed, so no rewrites) ----- #
    location /admin-panel/ {
        alias /srv/admin/;
        try_files $uri $uri/ /admin-panel/index.html;
    }

    # --- Web app: Next.js serves everything else -------------------------- #
    location / {
        proxy_pass http://webapp:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
