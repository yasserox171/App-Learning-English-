services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://lms:lms@db:5432/lms
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: docker-dev-key
      # nginx forwards the original Host (e.g. the server's public IP), so it
      # must be allowed or Django answers 400 DisallowedHost to every request
      # coming from the mobile app.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,84.8.223.62,lms.centrefocus.ma,centrefocus.ma
      # Absolute base for uploaded media. The localhost default is unreachable
      # from a phone or browser; nginx serves /media/ on port 80.
      VIDEO_PLAYBACK_BASE_URL: http://84.8.223.62/media/
    depends_on:
      db:
        condition: service_healthy

  # Next.js web app (v2 §8) — same API surface as the Flutter app.
  webapp:
    build: ../web
    restart: unless-stopped
    expose:
      - "3000"

  # Single public entrypoint on :80. Oracle Cloud's security list only opens
  # 80/443, so everything the outside world reaches goes through here:
  #   /api/, /admin/   -> Django
  #   /admin-panel/    -> built React admin panel (static)
  #   /                -> Next.js web app
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../admin/dist:/srv/admin:ro
      # nginx.conf aliases /app/media/; without this mount that path does not
      # exist in the nginx container and every uploaded file 404s even though
      # Django wrote it successfully. Same directory the web service sees via
      # its `.:/app` mount, so MEDIA_ROOT and the alias now agree.
      - ./media:/app/media:ro
    depends_on:
      - web
      - webapp

volumes:
  pgdata:
